# Compila o APK do Copiloto. O aparelho de compilacao e o runner do GitHub:
# ele ja vem com o Android SDK, que nao existe na maquina de ninguem aqui.
#
# O APK sai como artefato da execucao, em Actions > a execucao > Artifacts.
# E um APK de debug: instala direto no celular (habilitando "instalar de fontes
# desconhecidas"). Mas e assinado com a CHAVE ESTAVEL do segredo
# ANDROID_KEYSTORE, e nao com a chave de debug do runner -- essa o GitHub
# gera nova em cada execucao, e assinatura diferente faz o Android recusar a
# instalacao com "o pacote tem um conflito com um pacote ja existente".
# Veja nativo/README.md para como o segredo e criado.
name: APK

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "copiloto/**"
      - "nativo/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nativo/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Testes do app web
        run: ./test/check.sh
        working-directory: copiloto

      - name: Instalar o Capacitor
        run: npm ci
        working-directory: nativo

      - name: Montar www/ e sincronizar o projeto Android
        run: npm run sync
        working-directory: nativo

      - uses: gradle/actions/setup-gradle@v4

      # Sem este passo cada APK sai com uma assinatura diferente e nao instala
      # sobre o anterior. Com ele, instalar e atualizar, e o banco de dados do
      # motorista sobrevive a troca de versao e de sabor.
      # O segredo ANDROID_KEYSTORE traz duas coisas numa colagem so: a senha e o
      # cofre em base64. Um segredo em vez de tres, porque criar segredo no
      # navegador do celular e a parte chata deste conserto.
      #
      # A leitura e DELIBERADAMENTE tolerante. A primeira tentativa separava por
      # linha e o cofre chegou corrompido -- a colagem perdeu a quebra de linha, e
      # o erro so apareceu trinta linhas depois, dentro do Gradle, como
      # "Tag number over 30 is not supported". Nao se pede a um motorista que
      # acerte formatacao de base64 no celular.
      #
      # Agora: tira todo espaco e quebra de linha e separa no "MII" -- base64 de
      # PKCS12 sempre comeca assim (DER 0x30 0x82). Funciona com as partes em
      # linhas separadas, juntas, ou requebradas pelo navegador.
      - name: Escrever a chave de assinatura
        id: chave
        env:
          CHAVE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$CHAVE" ]; then
            echo "::warning title=Sem chave estavel::O segredo ANDROID_KEYSTORE nao esta configurado. Este APK nao vai instalar sobre o anterior."
            exit 0
          fi

          limpo=$(printf '%s' "$CHAVE" | tr -d '[:space:]')
          senha=${limpo%%MII*}
          echo "::add-mask::$senha"
          cofre="MII${limpo#*MII}"

          if [ "$senha" = "$limpo" ]; then
            echo "::error title=Falta o cofre no segredo::O segredo ANDROID_KEYSTORE nao tem a parte base64, que comeca com MII. Cole o arquivo COLAR-NO-GITHUB.txt INTEIRO (selecionar tudo), nao so a primeira linha."
            exit 1
          fi
          if [ -z "$senha" ]; then
            echo "::error title=Falta a senha no segredo::O segredo comeca direto no cofre. Falta a primeira linha, que e a senha."
            exit 1
          fi

          if ! printf '%s' "$cofre" | base64 -d > app/chave.p12 2>/dev/null; then
            echo "::error title=base64 invalido::A parte base64 do segredo nao decodifica. Provavel colagem incompleta -- refaca selecionando TUDO."
            exit 1
          fi
          echo "senha: ${#senha} caracteres · cofre: $(stat -c%s app/chave.p12) bytes"

          # Abrir o cofre AQUI, com uma mensagem que diz o que fazer, em vez de
          # deixar o Gradle morrer com erro de DER no meio da compilacao.
          if ! keytool -list -keystore app/chave.p12 -storetype PKCS12 \
                 -storepass "$senha" -alias copiloto >/dev/null 2>&1; then
            echo "::error title=O cofre nao abriu::O arquivo decodificou mas nao e um PKCS12 valido com a chave 'copiloto', ou a senha nao bate. Refaca o segredo colando o arquivo inteiro."
            exit 1
          fi
          echo "Cofre aberto e chave 'copiloto' encontrada."
          echo "senha=$senha" >> "$GITHUB_OUTPUT"
        working-directory: nativo/android

      # So o sabor "completo". O "limpo" continua existindo no build.gradle --
      # foi o que salvou quando o aplicativo de banco barrou o aparelho, e um
      # dia pode salvar de novo -- mas compilar os dois a cada push so dobrava o
      # tempo e dava dois arquivos para ele escolher errado na pressa.
      # Para gerar o limpo quando precisar: ./gradlew assembleLimpoDebug.
      - name: Compilar o APK de debug
        env:
          CHAVE_SENHA: ${{ steps.chave.outputs.senha }}
          # O numero da execucao vira versionCode: sempre sobe, nunca repete.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleCompletoDebug
        working-directory: nativo/android

      # O APK dele so instala por cima se a assinatura for ESTA. Conferir aqui
      # custa dois segundos e transforma "instalei e deu conflito de novo" em
      # "o build falhou e disse por que".
      - name: Conferir a assinatura
        env:
          CHAVE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          esperada=$(cat assinatura-esperada.txt)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          falhou=0
          for apk in app/build/outputs/apk/*/debug/*.apk; do
            digest=$("$apksigner" verify --print-certs "$apk" \
              | grep -i "certificate SHA-256 digest" | head -1 \
              | sed "s/.*: *//" | tr -d " " | tr "A-Z" "a-z")
            if [ "$digest" = "$esperada" ]; then
              echo "ok   $(basename "$apk") -> $digest"
            elif [ -z "$CHAVE" ]; then
              echo "::warning title=APK sem a chave estavel::$(basename "$apk") esta assinado com a chave desta maquina ($digest). NAO instala sobre o APK anterior. Falta o segredo ANDROID_KEYSTORE."
            else
              echo "::error title=Assinatura errada::$(basename "$apk") saiu com $digest, esperado $esperada. O segredo ANDROID_KEYSTORE esta com conteudo errado."
              falhou=1
            fi
          done
          exit $falhou
        working-directory: nativo/android

      - name: Renomear com a data e o commit
        id: apk
        run: |
          data=$(date +%Y%m%d)
          curto=${GITHUB_SHA::7}
          # A versao entra no nome do arquivo porque instalar um APK mais antigo
          # sobre um mais novo tambem falha, e sem o numero nao ha como saber.
          mkdir -p saida
          mv app/build/outputs/apk/completo/debug/app-completo-debug.apk \
             "saida/copiloto-v$GITHUB_RUN_NUMBER-$data-$curto.apk"
          echo "nome=copiloto-v$GITHUB_RUN_NUMBER-$data-$curto" >> "$GITHUB_OUTPUT"
          ls -lh saida
        working-directory: nativo/android

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.nome }}
          path: nativo/android/saida
          if-no-files-found: error
          retention-days: 90
