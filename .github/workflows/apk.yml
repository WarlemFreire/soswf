# Compila o APK do Copiloto. O aparelho de compilacao e o runner do GitHub:
# ele ja vem com o Android SDK, que nao existe na maquina de ninguem aqui.
#
# O APK sai como artefato da execucao, em Actions > a execucao > Artifacts.
# E um APK de debug: instala direto no celular (habilitando "instalar de fontes
# desconhecidas"). Mas e assinado com a CHAVE ESTAVEL do segredo
# ANDROID_KEYSTORE, e nao com a chave de debug do runner -- essa o GitHub
# gera nova em cada execucao, e assinatura diferente faz o Android recusar a
# instalacao com "o pacote tem um conflito com um pacote ja existente".
# Veja nativo/README.md para como o segredo e criado.
name: APK

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "copiloto/**"
      - "nativo/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nativo/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Testes do app web
        run: ./test/check.sh
        working-directory: copiloto

      - name: Instalar o Capacitor
        run: npm ci
        working-directory: nativo

      - name: Montar www/ e sincronizar o projeto Android
        run: npm run sync
        working-directory: nativo

      - uses: gradle/actions/setup-gradle@v4

      # Sem este passo cada APK sai com uma assinatura diferente e nao instala
      # sobre o anterior. Com ele, instalar e atualizar, e o banco de dados do
      # motorista sobrevive a troca de versao e de sabor.
      # O segredo ANDROID_KEYSTORE traz duas coisas numa colagem so: a senha na
      # primeira linha, o cofre em base64 nas demais. Um segredo em vez de tres,
      # porque criar segredo no navegador do celular e a parte chata deste conserto.
      - name: Escrever a chave de assinatura
        id: chave
        env:
          CHAVE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$CHAVE" ]; then
            senha=$(printf '%s' "$CHAVE" | head -1 | tr -d ' \r')
            printf '%s' "$CHAVE" | tail -n +2 | tr -d ' \n\r' | base64 -d > app/chave.p12
            echo "::add-mask::$senha"
            echo "senha=$senha" >> "$GITHUB_OUTPUT"
            echo "Chave estavel escrita ($(stat -c%s app/chave.p12) bytes)."
          else
            echo "::warning title=Sem chave estavel::O segredo ANDROID_KEYSTORE nao esta configurado. Este APK nao vai instalar sobre o anterior."
          fi
        working-directory: nativo/android

      # Dois sabores: "limpo" sem leitura de tela nem sobreposicao (nao briga com
      # aplicativo de banco) e "completo" com o semaforo.
      - name: Compilar os dois APKs de debug
        env:
          CHAVE_SENHA: ${{ steps.chave.outputs.senha }}
          # O numero da execucao vira versionCode: sempre sobe, nunca repete.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleLimpoDebug assembleCompletoDebug
        working-directory: nativo/android

      # O APK dele so instala por cima se a assinatura for ESTA. Conferir aqui
      # custa dois segundos e transforma "instalei e deu conflito de novo" em
      # "o build falhou e disse por que".
      - name: Conferir a assinatura
        env:
          CHAVE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          esperada=$(cat assinatura-esperada.txt)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          falhou=0
          for apk in app/build/outputs/apk/*/debug/*.apk; do
            digest=$("$apksigner" verify --print-certs "$apk" \
              | grep -i "certificate SHA-256 digest" | head -1 \
              | sed "s/.*: *//" | tr -d " " | tr "A-Z" "a-z")
            if [ "$digest" = "$esperada" ]; then
              echo "ok   $(basename "$apk") -> $digest"
            elif [ -z "$CHAVE" ]; then
              echo "::warning title=APK sem a chave estavel::$(basename "$apk") esta assinado com a chave desta maquina ($digest). NAO instala sobre o APK anterior. Falta o segredo ANDROID_KEYSTORE."
            else
              echo "::error title=Assinatura errada::$(basename "$apk") saiu com $digest, esperado $esperada. O segredo ANDROID_KEYSTORE esta com conteudo errado."
              falhou=1
            fi
          done
          exit $falhou
        working-directory: nativo/android

      - name: Renomear com a data e o commit
        id: apk
        run: |
          data=$(date +%Y%m%d)
          curto=${GITHUB_SHA::7}
          # A versao entra no nome do arquivo porque instalar um APK mais antigo
          # sobre um mais novo tambem falha, e sem o numero nao ha como saber.
          mkdir -p saida
          mv app/build/outputs/apk/limpo/debug/app-limpo-debug.apk \
             "saida/copiloto-LIMPO-v$GITHUB_RUN_NUMBER-$data-$curto.apk"
          mv app/build/outputs/apk/completo/debug/app-completo-debug.apk \
             "saida/copiloto-COMPLETO-v$GITHUB_RUN_NUMBER-$data-$curto.apk"
          echo "nome=copiloto-v$GITHUB_RUN_NUMBER-$data-$curto" >> "$GITHUB_OUTPUT"
          ls -lh saida
        working-directory: nativo/android

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.nome }}
          path: nativo/android/saida
          if-no-files-found: error
          retention-days: 90
