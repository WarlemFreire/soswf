apply plugin: 'com.android.application'

// ---------------------------------------------------------------- assinatura
//
// POR QUE ISTO EXISTE: o Android recusa atualizar um aplicativo instalado se a
// assinatura mudou -- a mensagem que aparece e "o pacote tem um conflito com um
// pacote ja existente". E o runner do GitHub gera uma chave de debug NOVA em
// cada execucao, entao, sem o que esta aqui, cada APK compilado era assinado
// com uma chave diferente e nao instalava sobre o anterior. Nem a troca entre
// "limpo" e "completo" funcionava, apesar do applicationId ser o mesmo.
//
// A chave fica FORA do repositorio, que e publico: no segredo
// ANDROID_KEYSTORE. O fluxo a escreve em app/chave.p12 antes de
// compilar. Ver .github/workflows/apk.yml e nativo/README.md.
//
// UM segredo so, e nao tres: o segredo carrega a senha na primeira linha e o
// cofre em base64 nas demais, e o fluxo separa os dois. Senha nenhuma fica no
// repositorio -- nem precisava ficar para funcionar, e credencial em codigo e
// exatamente o tipo de coisa que depois ninguem lembra que esta ali.
//
// Sem o arquivo o build NAO falha: volta a assinar com a chave de debug da
// maquina, com aviso. Isso mantem o projeto compilavel por quem clonar -- e o
// aviso diz em voz alta o que isso custa.
def chaveArquivo = file("chave.p12")
def chaveSenha = System.getenv("CHAVE_SENHA")
def chaveAlias = "copiloto"
def temChaveEstavel = chaveArquivo.exists() && chaveSenha != null && !chaveSenha.trim().isEmpty()

android {
    namespace "com.soswf.copiloto"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.soswf.copiloto"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Cada compilacao recebe um numero maior (o numero da execucao no
        // GitHub). Sem isso todo APK seria a "versao 1" e nao havia como o
        // sistema -- nem ele -- saber qual e o mais novo.
        //
        // Integer.parseInt e nao "(...) as int": em Groovy o `as` tem precedencia
        // MENOR que a chamada de metodo, entao `versionCode (x) as int` vira
        // `versionCode(x) as int` -- passa a String e converte o RETORNO. Deu
        // "Value is null" no build, que nao parece em nada com a causa.
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName System.getenv("VERSION_NAME") ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Dois sabores do mesmo codigo. O applicationId e o MESMO nos dois, e com a
    // chave estavel acima trocar de sabor e uma ATUALIZACAO, nao uma instalacao
    // nova -- o historico dele nao se perde. Sem a chave estavel essa promessa
    // nao se cumpre: era exatamente o que estava quebrado.
    flavorDimensions "leitor"
    productFlavors {
        // Sem leitura de tela e sem sobreposicao. Nao briga com aplicativo de
        // banco, e tem todo o resto do app.
        limpo {
            dimension "leitor"
            resValue "string", "app_name", "Copiloto"
        }
        // Com o semaforo. Banco brasileiro recusa aparelho com servico de
        // acessibilidade desconhecido habilitado -- e a troca e consciente.
        completo {
            dimension "leitor"
            resValue "string", "app_name", "Copiloto+"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Fora do bloco android{} de proposito: a configuracao de assinatura so passa a
// EXISTIR quando ha chave, em vez de existir vazia. Config vazio e uma armadilha
// -- em algumas versoes do AGP ele e validado mesmo sem ninguem usar.
if (temChaveEstavel) {
    android.signingConfigs.create("estavel") {
        storeFile chaveArquivo
        storePassword chaveSenha
        keyAlias chaveAlias
        // Chave e cofre com a mesma senha: e um cofre com uma chave so.
        keyPassword chaveSenha
    }
    // Debug tambem, porque o APK que ele instala no celular e o de debug.
    android.buildTypes.getByName("debug").signingConfig = android.signingConfigs.getByName("estavel")
    android.buildTypes.getByName("release").signingConfig = android.signingConfigs.getByName("estavel")
} else {
    logger.lifecycle("Copiloto: sem chave estavel (falta app/chave.p12 ou a senha). " +
        "O APK vai assinado com a chave de debug desta maquina e NAO instala " +
        "sobre um APK compilado em outra maquina.")
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
